<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RuzgArda - Tekne İzleme Paneli</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .header {
      text-align: center;
      padding-bottom: 20px;
      border-bottom: 1px solid #334155;
      margin-bottom: 30px;
    }

    .header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--accent-blue);
    }

    .status-tag {
      display: inline-block;
      font-size: 0.85rem;
      background-color: rgba(74, 222, 128, 0.1);
      color: var(--accent-green);
      padding: 4px 12px;
      border-radius: 20px;
      margin-top: 10px;
      border: 1px solid rgba(74, 222, 128, 0.2);
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }

    .card-title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-sub);
      margin-bottom: 15px;
    }

    .card-value {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 8px;
    }

    .card-unit {
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .val-wind { color: var(--accent-blue); }
    .val-volt { color: var(--accent-green); }
    .val-temp { color: #f97316; }
    .val-press { color: var(--accent-yellow); }

    .footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>RuzgArda</h1>
    <div id="status" class="status-tag">Veri Yükleniyor...</div>
  </div>

  <div class="dashboard-grid">
    <div class="card">
      <div class="card-title">Rüzgâr Hızı</div>
      <div id="windVal" class="card-value val-wind">0.0</div>
      <div class="card-unit">Knot</div>
    </div>

    <div class="card">
      <div class="card-title">Akü Voltajı</div>
      <div id="voltVal" class="card-value val-volt">0.00</div>
      <div class="card-unit">Volt (DC)</div>
    </div>

    <div class="card">
      <div class="card-title">Sıcaklık</div>
      <div id="tempVal" class="card-value val-temp">0.0</div>
      <div class="card-unit">°C</div>
    </div>

    <div class="card">
      <div class="card-title">Barometre</div>
      <div id="pressVal" class="card-value val-press">0</div>
      <div class="card-unit">hPa</div>
    </div>
  </div>

  <div class="footer">
    RuzgArda Marine Dashboard &copy; 2026
  </div>

  <script>
    const channelId = '3521886';
    const readApiKey = '3X9QT5GTRJTRBYBW';
    const url = `https://api.thingspeak.com/channels/${channelId}/feeds/last.json?api_key=${readApiKey}`;

    function verileriCek() {
      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data && data.created_at) {
            document.getElementById('windVal').innerText = data.field1 ? parseFloat(data.field1).toFixed(1) : '0.0';
            document.getElementById('voltVal').innerText = data.field2 ? parseFloat(data.field2).toFixed(2) : '0.00';
            document.getElementById('tempVal').innerText = data.field3 ? parseFloat(data.field3).toFixed(1) : '0.0';
            document.getElementById('pressVal').innerText = data.field4 ? Math.round(parseFloat(data.field4)) : '0';

            const tarih = new Date(data.created_at);
            const saatStr = tarih.toLocaleTimeString('tr-TR');
            document.getElementById('status').innerText = `Canlı Veri • Son Güncelleme: ${saatStr}`;
          } else {
            document.getElementById('status').innerText = 'Henüz Veri Yok';
          }
        })
        .catch(error => {
          console.error('Veri çekme hatası:', error);
          document.getElementById('status').innerText = 'Bağlantı Hatası';
        });
    }

    verileriCek();
    setInterval(verileriCek, 15000);
  </script>
</body>
</html>
